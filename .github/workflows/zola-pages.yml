# .github/workflows/zola-pages.yml
name: Deploy Zola to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the site with Zola (only build; we'll deploy with actions/deploy-pages)
      - name: Build with Zola
        uses: shalzz/zola-deploy-action@v0.21.0
        env:
          BUILD_ONLY: "true"        # <- just build to ./public
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout (for new-post detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Email subscribers about new posts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: "bc13dad3-f1eb-49f3-a44f-915cdf0c6541"
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 .github/scripts/notify_new_posts.py
