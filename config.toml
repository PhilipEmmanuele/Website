# The URL the site will be built for
base_url = "https://www.philip-emmanuele.com"
theme = "anemone"

# Build options
compile_sass = true
build_search_index = false

title = "Philip's Blog"
description = "A blog about cutting edge synthetic biology research."

# Feeds
# generate_feeds controls the site-wide feed at /rss.xml (would pull in every
# page on the site, e.g. /about/, /scihub/ — not wanted). The blog's own feed
# at /blog/rss.xml is enabled independently via generate_feeds in
# content/blog/_index.md, and that's the one linked from <head>.
generate_feeds = false
feed_filenames = ["rss.xml"]

# Taxonomies
taxonomies = [
  { name = "tags" }
]

# Markdown / code highlighting moved under this table
[markdown]
highlight_code = true
highlight_theme = "demain"  # choose any supported theme

# Extra (theme settings, etc.)
[extra]
list_pages = true
toc = true
display_author = true

header_nav = [
  { url = "/about/", name_en = "About", name_fr = "About" },
  { url = "/blog/", name_en = "Blog", name_fr = "Blog" },
  { url = "/scihub/", name_en = "SciHub", name_fr = "SciHub" }
]

# Keep existing extra settings if they are generic, but Anemone might not use them.
# For now, I'll comment out the old ones to avoid confusion, or just leave them if they don't conflict.
# Anemone uses specific keys.

author = "Philip Emmanuele"

# Cloudflare Worker URL that proxies email signups to Resend (set after deploying worker/)
subscribe_endpoint = "https://blog-subscribe.philip-emmanue.workers.dev"

